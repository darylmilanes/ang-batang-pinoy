<!DOCTYPE html>
<html lang="fil">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ang Batang Pinoy: Gabay sa Magandang Asal</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- PDF Generation Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

        /* Animation */
        @keyframes bounce-scale {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .animate-check { animation: bounce-scale 0.3s ease-in-out; }

        @keyframes pulse-gold {
            0%, 100% { box-shadow: 0 0 0 0px rgba(234, 179, 8, 0.4); }
            50% { box-shadow: 0 0 0 4px rgba(234, 179, 8, 0.1); }
        }

        /* --- DYNAMIC POSITIONING --- */
        #pdf-hidden-wrapper {
            position: fixed;
            top: 0;
            left: -5000px;
            width: 100vw;
            height: 100vh;
            z-index: -50;
            background: white;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            visibility: hidden;
        }

        #pdf-hidden-wrapper.generating {
            left: 0;
            visibility: visible;
            z-index: 9000;
        }

        #printable-contract-content {
            width: 794px; 
            min-height: 1123px;
            background: white;
            flex-shrink: 0;
        }

        /* Certificate Styles */
        .certificate-frame {
            padding: 40px;
            border: 10px double #1f2937;
            height: 100%;
            background-color: white;
            position: relative;
        }
        .certificate-corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border-color: #d97706;
            border-style: solid;
        }
        .c-tl { top: 20px; left: 20px; border-width: 4px 0 0 4px; }
        .c-tr { top: 20px; right: 20px; border-width: 4px 4px 0 0; }
        .c-bl { bottom: 20px; left: 20px; border-width: 0 0 4px 4px; }
        .c-br { bottom: 20px; right: 20px; border-width: 0 4px 4px 0; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- EXPANDED DATA ---
        const VALUES_DATA = [
            { 
                id: 1, 
                title: "Paggalang (Respect)", 
                icon: "users", 
                color: "bg-blue-100 text-blue-700", 
                problem: "Nawawala na ang takot at respeto sa nakatatanda. Pagsagot ng pabalang at hindi pakikinig.", 
                solution: "Makinig kapag kinakausap. Gamitin ang 'Po' at 'Opo' nang taos-puso. Huwag sumapaw sa usapan.", 
                why: "Ang respeto ay parang salamin. Kung gusto mong igalang ka ng iba kapag matanda ka na, simulan mo itong ibigay ngayon. Ito ang pundasyon ng masayang pamilya.", 
                scenario: "SITWASYON: Tinatawag ka ni Lola habang naglalaro ka sa cellphone.\n\n❌ Maling Gawi: Sumigaw ng 'Wait lang!' nang hindi tumitingin.\n✅ Tamang Gawi: I-pause ang laro, lumapit kay Lola, at magtanong nang mahinahon." 
            },
            { 
                id: 2, 
                title: "Pagpapahalaga sa Oras (Punctuality)", 
                icon: "clock", 
                color: "bg-red-100 text-red-700", 
                problem: "Ang mentalidad na 'Filipino Time'. Laging huli at pinaghihintay ang iba.", 
                solution: "Dumating ng 10-15 minuto bago ang usapan. I-budget ang oras ng biyahe at paghahanda.", 
                why: "Ang oras ay hindi naibabalik. Kapag pinaghintay mo ang iba, parang sinabi mo na ring mas mahalaga ang oras mo kaysa sa kanila. Ang pagiging maaga ay tanda ng isang propesyonal.", 
                scenario: "SITWASYON: May usapan kayo ng kaibigan mo na magkikita ng 3:00 PM.\n\n❌ Maling Gawi: Gigising o maliligo pa lang ng 3:00 PM.\n✅ Tamang Gawi: Dumating sa tagpuan ng 2:50 PM para hindi maghintay ang kaibigan." 
            },
            { 
                id: 3, 
                title: "Pananagutan (Accountability)", 
                icon: "shield-alert", 
                color: "bg-orange-100 text-orange-700", 
                problem: "Laging isinisisi sa iba ang pagkakamali. Maraming 'excuse' at hindi umaamin.", 
                solution: "Aminin agad ang mali, humingi ng tawad, at tanggapin ang parusa nang walang reklamo.", 
                why: "Walang taong perpekto, pero ang matapang na tao ay umaamin sa mali. Kapag umaamin ka, mas madali kang pagkatiwalaan ulit. Ang pagsisinungaling ay mas mabigat na kasalanan.", 
                scenario: "SITWASYON: Nakabasag ka ng vase habang naghahabulan sa sala.\n\n❌ Maling Gawi: Itinago ang basag na vase o sinisi ang pusa/kapatid.\n✅ Tamang Gawi: Puntahan agad si Nanay, aminin ang nangyari, at mag-offer na linisin ito." 
            },
            { 
                id: 4, 
                title: "Malasakit (Empathy)", 
                icon: "heart", 
                color: "bg-pink-100 text-pink-700", 
                problem: "Pagiging manhid. Hindi iniintindi ang nararamdaman ng iba basta masaya ka.", 
                solution: "Makiramdam sa paligid. Tanungin ang sarili: 'Makakasakit ba ako sa gagawin ko?'", 
                why: "Ang mundo ay puno na ng masasamang loob, huwag ka nang dumagdag. Ang maliit na tulong mo ay pwedeng bumago sa araw ng isang tao. Isipin mo, kung ikaw ang nasa sitwasyon niya, ano ang mararamdaman mo?", 
                scenario: "SITWASYON: Nakita mong nahulog ang gamit ng kaklase mo at pinagtawanan siya.\n\n❌ Maling Gawi: Makitawa o dedmahin lang.\n✅ Tamang Gawi: Tulungan siyang pulutin ang gamit at tanungin kung okay lang siya." 
            },
            { 
                id: 5, 
                title: "Pagkukusa (Initiative)", 
                icon: "hand", 
                color: "bg-green-100 text-green-700", 
                problem: "Hihintayin pang magalit o utusan bago kumilos. Walang kusa sa gawaing bahay.", 
                solution: "Kung may nakitang dumi, walisin. Huwag nang hintaying utusan.", 
                why: "Ang pagiging 'leader' ay nagsisimula sa pagkukusa. Kung gagawin mo lang ang bagay dahil inutos sa iyo, robot ka lang. Ang taong may kusa ay umaasenso sa buhay.", 
                scenario: "SITWASYON: Nakita mong puno na ang basurahan o marumi ang mesa.\n\n❌ Maling Gawi: Lampasan lang ito at hintayin si Nanay.\n✅ Tamang Gawi: Kusa itong linisin o itapon kahit walang nakatingin." 
            },
            { 
                id: 6, 
                title: "Pakikisama (Integrity)", 
                icon: "smile", 
                color: "bg-yellow-100 text-yellow-700", 
                problem: "Pagsama sa kalokohan para lang maging 'sikat' o tanggap ng barkada.", 
                solution: "Maging mabuting kaibigan pero marunong tumanggi sa mali.", 
                why: "Hindi lahat ng kaibigan ay mabuti. Ang tunay na pakikisama ay ang paggawa ng tama kasama ang iba, hindi ang paggawa ng mali para lang tanggapin ka nila. Mas mahalaga ang prinsipyo kaysa sa 'likes'.", 
                scenario: "SITWASYON: Nagyaya ang barkada na mang-asar o mang-bully ng iba.\n\n❌ Maling Gawi: Sumama at makitawa para hindi matawag na KJ (Kill Joy).\n✅ Tamang Gawi: Tumanggi nang maayos at sabihing, 'Pass muna ako dyan, hindi maganda yan.'" 
            },
            { 
                id: 7, 
                title: "Pagiging Organisado (Orderliness)", 
                icon: "check-square", 
                color: "bg-purple-100 text-purple-700", 
                problem: "Ugaling 'Bahala na' at cramming. Paggawa ng bagay kung kailan deadline na.", 
                solution: "Maghanda bago dumating ang araw. Ayusin ang gamit bago matulog.", 
                why: "Kapag magulo ang gamit mo, magulo din ang isip mo. Ang pagiging organisado ay nagtatanggal ng stress at nagbibigay sa iyo ng mas maraming oras para maglaro o magpahinga.", 
                scenario: "SITWASYON: Gabi na at may pasok bukas ng maaga.\n\n❌ Maling Gawi: Iwanan ang bag kung saan-saan at maghanap ng medyas sa umaga.\n✅ Tamang Gawi: Ihanda ang uniform, bag, at baon bago matulog para relax sa umaga." 
            },
            { 
                id: 8, 
                title: "Pagpapakumbaba (Humility)", 
                icon: "arrow-down-circle", 
                color: "bg-indigo-100 text-indigo-700", 
                problem: "Yabang o entitlement. Pag-aakalang mas magaling sa magulang/guro.", 
                solution: "Tanggapin na hindi mo alam ang lahat. Maging bukas sa pangaral at kritisismo.", 
                why: "Hindi mo alam ang lahat ng bagay. Ang taong mataas ang tingin sa sarili ay mahirap tulungan at turuan. Ang pagpapakumbaba ay susi para gumaling ka pa lalo.", 
                scenario: "SITWASYON: Pinagsabihan ka ng guro o magulang dahil sa pagkakamali.\n\n❌ Maling Gawi: Padabog na sumagot, irapan sila, o magbulong ng masama.\n✅ Tamang Gawi: Makinig, tanggapin ang pagkakamali, at sabihing 'Sorry po, hindi na po mauulit'." 
            },
            { 
                id: 9, 
                title: "Pasasalamat (Gratitude)", 
                icon: "gift", 
                color: "bg-teal-100 text-teal-700", 
                problem: "Pagrereklamo sa kung anong meron. Hindi pag-appreciate sa maliit na bagay.", 
                solution: "Laging magpasalamat. Maging kontento sa kung anong nasa hapag.", 
                why: "Maraming bata ang walang makain o walang magulang na nag-aalaga sa kanila. Ang pagpapahalaga sa kung anong meron ka ay ang sikreto para maging masaya sa buhay.", 
                scenario: "SITWASYON: Nagluto si Nanay ng ulam na gulay at hindi mo ito paborito.\n\n❌ Maling Gawi: Magsabi ng 'Ayoko niyan!' o sumimangot sa mesa.\n✅ Tamang Gawi: Magsabi ng 'Salamat po sa pagluto, Nay' at subukang kainin ito." 
            },
            { 
                id: 10, 
                title: "Pagsisikap (Perseverance)", 
                icon: "trending-up", 
                color: "bg-rose-100 text-rose-700", 
                problem: "Pagsuko agad kapag nahirapan. Gusto ng instant results.", 
                solution: "Huwag sumuko sa math problem o sport. Ang tagumpay ay pinaghihirapan.", 
                why: "Ang tagumpay ay hindi nakukuha sa madalian. Lahat ng magaling ngayon ay nagsimula bilang hindi marunong. Ang tanging paraan para matuto ay ang hindi pagsuko kapag mahirap.", 
                scenario: "SITWASYON: Nahihirapan ka sa Math homework o natatalo sa laro.\n\n❌ Maling Gawi: Ibato ang lapis, umiyak, at sabihing 'Ayoko na!'.\n✅ Tamang Gawi: Huminga ng malalim, magpahinga saglit, at subukan ulit o magpaturo sa iba." 
            },
            // --- THE 11TH SPECIAL ITEM ---
            { 
                id: 11, 
                title: "Pagiging Maka-Diyos (Godliness)", 
                icon: "star", 
                color: "bg-amber-50 text-amber-800", // Fallback color
                special: true, // Special Flag
                problem: "Pag-alaala lang sa Diyos kapag may kailangan o may problema. Pagkalimot magpasalamat.", 
                solution: "Isama ang Diyos sa araw-araw. Magdasal hindi lang para humiling, kundi para magpasalamat.", 
                why: "Ito ang pinakamataas na antas ng kabutihan. Kapag may takot at pagmamahal ka sa Diyos, kusa mong gagawin ang tama kahit walang nakatingin na tao.", 
                scenario: "SITWASYON: Gabi na at pagod na pagod ka galing sa laro o eskwela.\n\n❌ Maling Gawi: Matutulog na lang agad nang hindi nagpapasalamat.\n✅ Tamang Gawi: Maglalaan ng kahit sandali para magdasal at magpasalamat sa proteksyon ng Diyos sa buong araw." 
            }
        ];

        const CHECKLIST_ITEMS = [
            { id: "c1", text: "Nagmano ako at gumamit ng 'po/opo' (Respect).", points: 1 },
            { id: "c2", text: "Hindi ako nahuli sa anumang usapan o klase (Punctuality).", points: 1 },
            { id: "c3", text: "Inamin ko ang mali ko at hindi nanisi ng iba (Accountability).", points: 1 },
            { id: "c4", text: "Inisip ko ang mararamdaman ng iba bago ako kumilos (Empathy).", points: 1 },
            { id: "c5", text: "Kusa akong tumulong sa gawaing bahay (Initiative).", points: 1 },
            { id: "c6", text: "Gumawa ako ng tama kahit walang nakatingin (Integrity).", points: 1 },
            { id: "c7", text: "Inayos ko ang aking higaan at gamit (Orderliness).", points: 1 },
            { id: "c8", text: "Nakinig ako sa payo ng magulang o guro (Humility).", points: 1 },
            { id: "c9", text: "Nagpasalamat ako sa mga biyayang natanggap ko (Gratitude).", points: 1 },
            { id: "c10", text: "Tinapos ko ang gawain kahit medyo mahirap (Perseverance).", points: 1 },
            { id: "c11", text: "Nagdasal at nagpasalamat ako sa Diyos (Godliness).", points: 1 }
        ];

        // --- ICONS ---
        const Icon = ({ name, size = 24, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} width={size} height={size} className={className}></i>;
        };

        // --- COMPONENTS ---
        const ValuesDeck = () => {
            const [expandedId, setExpandedId] = useState(null);
            const toggleCard = (id) => setExpandedId(expandedId === id ? null : id);

            return (
                <div className="space-y-4 pb-20">
                    <div className="bg-gradient-to-r from-blue-500 to-cyan-400 p-6 rounded-2xl shadow-lg text-white mb-6">
                        <h2 className="text-2xl font-bold">Gabay ng Batang Pinoy</h2>
                        <p className="opacity-90 mt-1 text-sm">Ang pagiging bata ay hindi excuse. Maging magalang, responsable, at mabuti.</p>
                    </div>
                    {VALUES_DATA.map((val) => {
                        const isSpecial = val.special;
                        const cardClasses = isSpecial 
                            ? `bg-white rounded-xl overflow-hidden transition-all duration-300 border-2 border-amber-300 shadow-[0_0_15px_rgba(251,191,36,0.2)] ${expandedId === val.id ? 'ring-2 ring-amber-400 scale-[1.02]' : ''}`
                            : `bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden transition-all duration-300 ${expandedId === val.id ? 'ring-2 ring-blue-400 shadow-md' : ''}`;

                        const headerClasses = isSpecial
                            ? "bg-gradient-to-r from-amber-100 to-yellow-100"
                            : "";

                        return (
                            <div key={val.id} onClick={() => toggleCard(val.id)} className={cardClasses}>
                                <div className={`flex items-center p-4 cursor-pointer ${headerClasses}`}>
                                    <div className={`p-3 rounded-full mr-4 ${val.color} ${isSpecial ? 'shadow-inner ring-2 ring-amber-200' : ''}`}>
                                        <Icon name={val.icon} size={24} className={isSpecial ? "text-amber-600 fill-amber-100" : ""} />
                                    </div>
                                    <div className="flex-1">
                                        <h3 className={`font-bold ${isSpecial ? 'text-amber-800' : 'text-gray-800'}`}>
                                            {val.id}. {val.title}
                                        </h3>
                                    </div>
                                    <Icon name={expandedId === val.id ? "chevron-up" : "chevron-down"} size={20} className={isSpecial ? "text-amber-500" : "text-gray-400"} />
                                </div>
                                {expandedId === val.id && (
                                    <div className="px-4 pb-6 bg-gray-50 border-t border-gray-100 text-sm">
                                        <div className="mt-4 space-y-4">
                                            <div className="p-4 bg-red-50 rounded-lg border border-red-100">
                                                <div className="flex items-center gap-2 mb-2">
                                                    <Icon name="alert-circle" size={16} className="text-red-600" />
                                                    <span className="font-bold text-red-600 text-xs uppercase tracking-wider">Ang Problema</span>
                                                </div>
                                                <p className="text-gray-700 leading-relaxed">{val.problem}</p>
                                            </div>
                                            
                                            <div className="p-4 bg-green-50 rounded-lg border border-green-100">
                                                <div className="flex items-center gap-2 mb-2">
                                                    <Icon name="check-circle" size={16} className="text-green-600" />
                                                    <span className="font-bold text-green-600 text-xs uppercase tracking-wider">Ang Solusyon</span>
                                                </div>
                                                <p className="text-gray-700 leading-relaxed">{val.solution}</p>
                                            </div>

                                            <div className={`p-4 rounded-lg border shadow-sm ${isSpecial ? 'bg-amber-50 border-amber-200' : 'bg-white border-gray-200'}`}>
                                                <div className="flex items-center gap-2 mb-2">
                                                    <Icon name="lightbulb" size={16} className={isSpecial ? "text-amber-600" : "text-blue-500"} />
                                                    <span className={`font-bold text-xs uppercase tracking-wider ${isSpecial ? 'text-amber-800' : 'text-gray-800'}`}>Bakit Kailangan?</span>
                                                </div>
                                                <p className={`${isSpecial ? 'text-amber-900' : 'text-gray-600'} italic leading-relaxed`}>{val.why}</p>
                                            </div>

                                            <div className="mt-2 bg-gray-100 p-4 rounded-lg border border-gray-200">
                                                <div className="flex items-center gap-2 mb-2">
                                                    <Icon name="play-circle" size={16} className="text-gray-600" />
                                                    <span className="font-bold text-gray-800 text-xs uppercase tracking-wider">Halimbawa</span>
                                                </div>
                                                <div className="whitespace-pre-line text-gray-700 leading-relaxed text-sm">
                                                    {val.scenario}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        );
                    })}
                </div>
            );
        };

        const Checklist = () => {
            const [checks, setChecks] = useState({});
            const [streak, setStreak] = useState(0);
            const [lastCompletedDate, setLastCompletedDate] = useState(null);

            useEffect(() => {
                const savedChecks = JSON.parse(localStorage.getItem('bp_checks')) || {};
                const savedStreak = parseInt(localStorage.getItem('bp_streak')) || 0;
                const savedDate = localStorage.getItem('bp_last_date');
                setChecks(savedChecks);
                setStreak(savedStreak);
                setLastCompletedDate(savedDate);
            }, []);

            useEffect(() => { localStorage.setItem('bp_checks', JSON.stringify(checks)); }, [checks]);

            const toggleCheck = (id) => setChecks(prev => ({ ...prev, [id]: !prev[id] }));
            const completedCount = Object.values(checks).filter(Boolean).length;
            const progress = (completedCount / CHECKLIST_ITEMS.length) * 100;

            const handleFinishDay = () => {
                const today = new Date().toLocaleDateString();
                if (lastCompletedDate === today) { alert("Natapos mo na ang araw na ito! Bukas naman ulit."); return; }
                if (completedCount < CHECKLIST_ITEMS.length && !confirm("Hindi mo pa natatapos lahat. Gusto mo na bang tapusin ang araw?")) return;
                
                let newStreak = completedCount >= 6 ? streak + 1 : 0;
                if (completedCount >= 6) alert(`Mahusay! Streak: ${newStreak} araw!`);
                else alert("Subukan nating kumpletuhin bukas para tumaas ang streak!");

                setStreak(newStreak);
                setLastCompletedDate(today);
                setChecks({});
                localStorage.setItem('bp_streak', newStreak);
                localStorage.setItem('bp_last_date', today);
                localStorage.setItem('bp_checks', JSON.stringify({}));
            };

            return (
                <div className="pb-20">
                    <div className="bg-gradient-to-br from-purple-600 to-indigo-500 p-6 rounded-2xl shadow-lg text-white mb-6 text-center">
                        <div className="flex justify-center items-center gap-2 mb-1"><Icon name="flame" className="text-orange-300" /><span className="text-3xl font-bold">{streak}</span></div>
                        <p className="text-sm font-medium opacity-80">Streak</p>
                        <div className="mt-4 bg-black/20 rounded-full h-2 w-full overflow-hidden"><div className="bg-green-400 h-full transition-all duration-500" style={{ width: `${progress}%` }}></div></div>
                        <p className="text-xs mt-2 text-right">{completedCount} / {CHECKLIST_ITEMS.length}</p>
                    </div>
                    <h3 className="font-bold text-gray-700 mb-3 px-1">Checklist Ngayong Araw:</h3>
                    <div className="space-y-3">
                        {CHECKLIST_ITEMS.map(item => (
                            <div key={item.id} onClick={() => toggleCheck(item.id)} className={`flex items-center p-4 bg-white rounded-xl border border-gray-100 shadow-sm cursor-pointer transition-all ${checks[item.id] ? 'bg-green-50 border-green-200' : 'hover:bg-gray-50'}`}>
                                <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center mr-3 transition-colors ${checks[item.id] ? 'bg-green-500 border-green-500' : 'border-gray-300'}`}>{checks[item.id] && <Icon name="check" size={14} className="text-white" />}</div>
                                <span className={`text-sm flex-1 ${checks[item.id] ? 'text-green-800 font-medium line-through decoration-green-300' : 'text-gray-700'}`}>{item.text}</span>
                            </div>
                        ))}
                    </div>
                    <button onClick={handleFinishDay} className="w-full mt-8 bg-gray-800 text-white font-bold py-4 rounded-xl shadow-lg active:scale-95 transition-transform flex items-center justify-center gap-2"><Icon name="moon" size={20} />Tapos na ang Araw</button>
                </div>
            );
        };

        const Contract = ({ childName, setChildName, parentName, setParentName, date, setDate, onPreview }) => {
            return (
                <div className="pb-20 relative">
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 text-center">
                        <div className="inline-block p-4 bg-yellow-100 rounded-full text-yellow-600 mb-3"><Icon name="file-signature" size={32} /></div>
                        <h2 className="text-xl font-bold text-gray-800">Kasunduan ng Pamilya</h2>
                        <p className="text-sm text-gray-500 mt-2">I-preview at i-download.</p>
                    
                        <div className="mt-6 space-y-4 text-left">
                            <input type="text" value={childName} onChange={(e) => setChildName(e.target.value)} className="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg" placeholder="Pangalan ng Bata" />
                            <input type="text" value={parentName} onChange={(e) => setParentName(e.target.value)} className="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg" placeholder="Pangalan ng Magulang" />
                            <input type="date" value={date} onChange={(e) => setDate(e.target.value)} className="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg" />
                        </div>

                        <button onClick={onPreview} className="w-full mt-6 bg-blue-600 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 hover:bg-blue-700 transition-colors">
                            <Icon name="eye" size={20} /> Preview
                        </button>
                    </div>
                </div>
            );
        };

        // --- MAIN APP ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('home');
            const [childName, setChildName] = useState("");
            const [parentName, setParentName] = useState("");
            const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
            
            // Preview Modal State
            const [showPreviewModal, setShowPreviewModal] = useState(false);
            const [previewUrl, setPreviewUrl] = useState(null);
            const [isGenerating, setIsGenerating] = useState(false);

            const handleGeneratePreview = async () => {
                if(!childName || !parentName) { alert("Pakilagay muna ang mga pangalan."); return; }
                
                // 1. Start Generation: Show Loader (Curtain)
                setIsGenerating(true);

                // 2. Wait for Curtain to cover screen, THEN move contract into view
                setTimeout(async () => {
                    const element = document.getElementById('printable-contract-content');
                    if (!element) { alert("Error: Contract element not found."); setIsGenerating(false); return; }
                    if (window.lucide) window.lucide.createIcons();

                    try {
                        // 3. Capture
                        const canvas = await html2canvas(element, {
                            scale: 2,
                            useCORS: true,
                            backgroundColor: '#ffffff',
                            width: 794, 
                            height: 1123,
                            windowWidth: 794,
                            windowHeight: 1123
                        });
                        setPreviewUrl(canvas.toDataURL('image/png'));
                        setShowPreviewModal(true);
                    } catch (error) { console.error("Preview Error:", error); alert("Failed to generate preview."); }
                    finally { 
                        // 4. Finish: Loader (Curtain) will disappear because isGenerating becomes false
                        // The CSS class .generating will also be removed, sending contract back off-screen
                        setIsGenerating(false); 
                    }
                }, 300);
            };

            const handleSavePdf = () => {
                if (!previewUrl) return;
                try {
                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF('p', 'mm', 'a4');
                    pdf.addImage(previewUrl, 'PNG', 0, 0, pdf.internal.pageSize.getWidth(), pdf.internal.pageSize.getHeight());
                    pdf.save(`Kasunduan_ng_Pamilya.pdf`);
                } catch (e) { alert("Error saving PDF."); }
            };

            return (
                <div id="app-root-container" className="flex flex-col min-h-screen">
                    <header className="bg-white p-4 sticky top-0 z-10 shadow-sm flex items-center justify-between">
                        <div className="flex items-center gap-2"><div className="bg-blue-600 text-white p-1.5 rounded-lg"><Icon name="sun" size={20} /></div><h1 className="font-bold text-gray-800 text-lg">Batang Pinoy</h1></div>
                    </header>

                    <main className="flex-1 p-4 overflow-y-auto w-full max-w-md mx-auto">
                        {activeTab === 'home' && <ValuesDeck />}
                        {activeTab === 'checklist' && <Checklist />}
                        {activeTab === 'contract' && <Contract childName={childName} setChildName={setChildName} parentName={parentName} setParentName={setParentName} date={date} setDate={setDate} onPreview={handleGeneratePreview} />}
                    </main>

                    <nav className="fixed bottom-0 w-full bg-white border-t border-gray-200 flex justify-around p-3 z-20 pb-safe">
                        <button onClick={() => setActiveTab('home')} className={`flex flex-col items-center gap-1 ${activeTab === 'home' ? 'text-blue-600' : 'text-gray-400'}`}><Icon name="book-open" size={24} /><span className="text-[10px] font-bold">Gabay</span></button>
                        <button onClick={() => setActiveTab('checklist')} className={`flex flex-col items-center gap-1 ${activeTab === 'checklist' ? 'text-blue-600' : 'text-gray-400'}`}><Icon name="check-circle" size={24} /><span className="text-[10px] font-bold">Tseklist</span></button>
                        <button onClick={() => setActiveTab('contract')} className={`flex flex-col items-center gap-1 ${activeTab === 'contract' ? 'text-blue-600' : 'text-gray-400'}`}><Icon name="pen-tool" size={24} /><span className="text-[10px] font-bold">Kasunduan</span></button>
                    </nav>

                    {/* PREVIEW MODAL */}
                    {showPreviewModal && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
                            <div className="bg-white rounded-2xl w-full max-w-sm md:max-w-lg flex flex-col max-h-[90vh]">
                                <div className="p-4 border-b flex justify-between items-center bg-gray-50">
                                    <h3 className="font-bold text-gray-800">Preview Contract</h3>
                                    <button onClick={() => setShowPreviewModal(false)} className="p-2 bg-gray-200 rounded-full hover:bg-gray-300 transition-colors"><Icon name="x" size={20} /></button>
                                </div>
                                <div className="flex-1 overflow-y-auto p-4 bg-gray-200 flex justify-center">
                                    <img src={previewUrl} className="shadow-lg max-w-full h-auto" />
                                </div>
                                <div className="p-4 border-t bg-white">
                                    <button onClick={handleSavePdf} className="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2"><Icon name="download" size={20} /> Save PDF</button>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {/* LOADING OVERLAY (The Curtain) - Z-Index 9999 */}
                    {isGenerating && (
                        <div className="fixed inset-0 z-[9999] bg-white flex items-center justify-center">
                            <div className="flex flex-col items-center gap-4">
                                <div className="animate-spin h-10 w-10 border-4 border-blue-500 border-t-transparent rounded-full"></div>
                                <p className="font-bold text-gray-600">Generating Contract Preview...</p>
                                <p className="text-xs text-gray-400">Please wait</p>
                            </div>
                        </div>
                    )}

                    {/* HIDDEN CONTRACT CONTENT */}
                    {/* Only moves to left:0 when .generating class is applied by React state */}
                    <div id="pdf-hidden-wrapper" className={isGenerating ? "generating" : ""}>
                        <div id="printable-contract-content">
                            <div className="certificate-frame flex flex-col items-center justify-between">
                                <div className="certificate-corner c-tl"></div><div className="certificate-corner c-tr"></div>
                                <div className="certificate-corner c-bl"></div><div className="certificate-corner c-br"></div>
                                <div className="text-center border-b-2 border-gray-800 pb-6 mb-8 w-full mt-8">
                                    <h1 className="text-4xl font-serif font-bold tracking-wider uppercase mb-2" style={{ fontFamily: 'Playfair Display, serif' }}>Kasunduan ng Karangalan</h1>
                                    <p className="italic text-gray-600">"Ang pagiging bata ay hindi dahilan para hindi maging responsable."</p>
                                </div>
                                <div className="w-full mb-6 text-xl leading-relaxed text-justify px-8">
                                    <p className="mb-6">Ako, si <span className="font-bold border-b border-black px-2">{childName || "_________________"}</span>, ay nangangakong gagawin ang aking makakaya upang maging isang mabuting bata.</p>
                                    <p>Nauunawaan ko na ang mga sumusunod na pagpapahalaga (values) ay mahalaga para sa aking paglaki at kinabukasan:</p>
                                </div>
                                <div className="grid grid-cols-2 gap-8 mb-8 text-base w-full px-16">
                                    <ul className="list-disc space-y-2"><li>Paggalang sa Nakatatanda</li><li>Pagpapahalaga sa Oras</li><li>Pananagutan sa Pagkakamali</li><li>Malasakit sa Kapwa</li><li>Pagkukusa sa Bahay</li><li>Pakikisama (Integrity)</li></ul>
                                    <ul className="list-disc space-y-2"><li>Pagiging Organisado</li><li>Pagpapakumbaba</li><li>Pasasalamat</li><li>Pagsisikap at Tiyaga</li><li>Pagiging Maka-Diyos</li></ul>
                                </div>
                                <div className="w-full mb-12 text-xl leading-relaxed text-justify px-8"><p>Kung ako ay magkakamali, handa akong tanggapin ang pagtutuwid ng aking mga magulang.</p></div>
                                <div className="flex justify-between w-full mt-auto px-12 mb-12">
                                    <div className="text-center"><div className="border-t border-black w-64 pt-2 font-bold uppercase text-lg">{childName || "Lagda ng Bata"}</div></div>
                                    <div className="text-center"><div className="border-t border-black w-64 pt-2 font-bold uppercase text-lg">{parentName || "Lagda ng Magulang"}</div></div>
                                </div>
                                <div className="text-center text-sm text-gray-400 mb-4">Nilagdaan ngayong ika-{new Date(date).getDate()} ng {new Date(date).toLocaleString('default', { month: 'long' })}, {new Date(date).getFullYear()}</div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
